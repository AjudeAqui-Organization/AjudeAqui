<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <title>Página Pagamento</title> 
</head>
<body>
    <header>
        <div class="header-content">
            <span>Finalize sua compra com confiança</span>
            <span>Conclua seu pagamento de forma rápida e segura abaixo</span>
        </div>
    </header>
    <main>
        <section>
            <form action="/process-payment" method="POST">
                <div class="form-group">
                    <label for="card-number">Número do cartão</label>
                    <input type="text" id="card-number" name="card-number" required>

                    <label for="card-holder">Nome do titular</label>
                    <input type="text" id="card-holder" name="card-holder" required>

                    <div class="date-cvv-container">
                        <div class="input-group">
                            <label for="expiry-date">Validade (MM/AA)</label>
                            <input type="text" id="expiry-date" name="expiry-date" required>
                        </div>
                        <div class="input-group">
                            <label for="cvv">CVV</label>
                            <input type="text" id="cvv" name="cvv" required>
                        </div>
                    </div>

                    <label for="installments">Parcelamento</label>
                    <input type="text" id="installments" name="installments" required>
                </div>
                <button type="submit">Pagar Agora</button>
            </form>
        </section>
    </main>
</body>
</html>
